<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 392" width="820" height="392">
  <rect width="820" height="392" fill="#ffffff"/>
  <text x="16" y="26" fill="#1c2833" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Encoding the batch above. Products are over GF(256).</text>
  <text x="16" y="58" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">chosen packets</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1c2833" text-anchor="middle">
    <rect x="16" y="70" width="88" height="36" rx="4" fill="#d5f5e3" stroke="#196f3d"/>
    <text x="60" y="93">p1</text>
    <rect x="16" y="114" width="88" height="36" rx="4" fill="#d5f5e3" stroke="#196f3d"/>
    <text x="60" y="137">p4</text>
    <rect x="16" y="158" width="88" height="36" rx="4" fill="#d5f5e3" stroke="#196f3d"/>
    <text x="60" y="181">p6</text>
  </g>
  <text x="122" y="140" fill="#1c2833" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22">x</text>
  <rect x="156" y="48" width="248" height="168" rx="6" fill="#fef9e7" stroke="#b9770e" stroke-dasharray="5 3"/>
  <text x="280" y="68" fill="#9a6b12" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">G is 3 x 8. It is not transmitted.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#7d6608" text-anchor="middle">
    <rect x="172" y="82" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="200" y="82" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="228" y="82" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="256" y="82" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="284" y="82" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="312" y="82" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="340" y="82" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="368" y="82" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <text x="185" y="97">g</text><text x="213" y="97">g</text><text x="241" y="97">g</text><text x="269" y="97">g</text>
    <text x="297" y="97">g</text><text x="325" y="97">g</text><text x="353" y="97">g</text><text x="381" y="97">g</text>
    <rect x="172" y="110" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="200" y="110" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="228" y="110" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="256" y="110" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="284" y="110" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="312" y="110" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="340" y="110" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="368" y="110" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <text x="185" y="125">g</text><text x="213" y="125">g</text><text x="241" y="125">g</text><text x="269" y="125">g</text>
    <text x="297" y="125">g</text><text x="325" y="125">g</text><text x="353" y="125">g</text><text x="381" y="125">g</text>
    <rect x="172" y="138" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="200" y="138" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="228" y="138" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="256" y="138" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="284" y="138" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="312" y="138" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="340" y="138" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <rect x="368" y="138" width="26" height="22" fill="#fdebd0" stroke="#b9770e"/>
    <text x="185" y="153">g</text><text x="213" y="153">g</text><text x="241" y="153">g</text><text x="269" y="153">g</text>
    <text x="297" y="153">g</text><text x="325" y="153">g</text><text x="353" y="153">g</text><text x="381" y="153">g</text>
  </g>
  <text x="156" y="232" fill="#9a6b12" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">top row is p1, middle is p4, bottom is p6</text>
  <text x="422" y="140" fill="#1c2833" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22">=</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1a5276" text-anchor="middle">
    <rect x="452" y="78" width="36" height="120" rx="3" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="470" y="144" transform="rotate(-90 470 144)">y0</text>
    <rect x="494" y="78" width="36" height="120" rx="3" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="512" y="144" transform="rotate(-90 512 144)">y1</text>
    <rect x="536" y="78" width="36" height="120" rx="3" fill="#1a5276" stroke="#1a5276"/>
    <text x="554" y="144" fill="#ffffff" transform="rotate(-90 554 144)">y2</text>
    <rect x="578" y="78" width="36" height="120" rx="3" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="596" y="144" transform="rotate(-90 596 144)">y3</text>
    <rect x="620" y="78" width="36" height="120" rx="3" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="638" y="144" transform="rotate(-90 638 144)">y4</text>
    <rect x="662" y="78" width="36" height="120" rx="3" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="680" y="144" transform="rotate(-90 680 144)">y5</text>
    <rect x="704" y="78" width="36" height="120" rx="3" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="722" y="144" transform="rotate(-90 722 144)">y6</text>
    <rect x="746" y="78" width="36" height="120" rx="3" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="764" y="144" transform="rotate(-90 764 144)">y7</text>
  </g>
  <text x="616" y="216" fill="#1a5276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">eight payloads, each T bytes</text>
  <text x="16" y="250" fill="#1c2833" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Packet 2, as it leaves the source. The highlighted column above is its payload.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">
    <rect x="16" y="266" width="120" height="52" rx="4" fill="#f4f6f7" stroke="#566573"/>
    <text x="76" y="288" fill="#5d6d7e">batch_id</text>
    <text x="76" y="306" fill="#1c2833">12</text>
    <rect x="148" y="266" width="360" height="52" rx="4" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="328" y="288" fill="#1a5276">coefficient, 8 bytes: column 2 of the identity</text>
    <text x="328" y="306" fill="#1c2833">0  0  1  0  0  0  0  0</text>
    <rect x="520" y="266" width="280" height="52" rx="4" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="660" y="288" fill="#1a5276">payload, T bytes</text>
    <text x="660" y="306" fill="#1c2833">column 2 of G times p1, p4, p6</text>
  </g>
  <text x="16" y="348" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">The same code_seed and batch_id rebuild G and the indices p1, p4, p6. Sending batch 12 again repeats these eight packets.</text>
  <text x="16" y="372" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">A relay replaces the coefficient. The destination uses the coefficient it receives, not this identity column.</text>
</svg>
