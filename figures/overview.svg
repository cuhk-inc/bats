<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 640" width="1128" height="640">
  <rect width="1128" height="640" fill="#ffffff"/>

  <rect x="16" y="16" width="356" height="608" rx="12" fill="#fffaf3" stroke="#f0d9b5"/>
  <rect x="386" y="16" width="356" height="608" rx="12" fill="#f4f8fb" stroke="#d4e6f1"/>
  <rect x="756" y="16" width="356" height="608" rx="12" fill="#f3faf5" stroke="#d5f5e3"/>

  <text x="194" y="52" fill="#9a6b12" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Source</text>
  <text x="564" y="52" fill="#1a5276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Relay</text>
  <text x="934" y="52" fill="#196f3d" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Destination</text>

  <text x="40" y="88" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">picks three packets</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">
    <rect x="40" y="100" width="96" height="40" rx="6" fill="#e67e22"/>
    <text x="88" y="126">p1</text>
    <rect x="148" y="100" width="96" height="40" rx="6" fill="#1e8449"/>
    <text x="196" y="126">p4</text>
    <rect x="256" y="100" width="96" height="40" rx="6" fill="#2471a3"/>
    <text x="304" y="126">p6</text>
  </g>

  <text x="40" y="168" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">mixes them by G. G is not sent</text>
  <g>
    <rect x="36" y="180" width="316" height="78" rx="6" fill="#ffffff" stroke="#b9770e" stroke-dasharray="5 3"/>
    <rect x="48" y="196" width="18" height="16" rx="2" fill="#e67e22"/>
    <rect x="48" y="216" width="18" height="16" rx="2" fill="#1e8449"/>
    <rect x="48" y="236" width="18" height="16" rx="2" fill="#2471a3"/>
    <g fill="#fdebd0" stroke="#e6b98a">
      <rect x="74" y="196" width="16" height="16"/><rect x="92" y="196" width="16" height="16"/><rect x="110" y="196" width="16" height="16"/><rect x="128" y="196" width="16" height="16"/><rect x="146" y="196" width="16" height="16"/><rect x="164" y="196" width="16" height="16"/><rect x="182" y="196" width="16" height="16"/><rect x="200" y="196" width="16" height="16"/>
      <rect x="74" y="216" width="16" height="16"/><rect x="92" y="216" width="16" height="16"/><rect x="110" y="216" width="16" height="16"/><rect x="128" y="216" width="16" height="16"/><rect x="146" y="216" width="16" height="16"/><rect x="164" y="216" width="16" height="16"/><rect x="182" y="216" width="16" height="16"/><rect x="200" y="216" width="16" height="16"/>
      <rect x="74" y="236" width="16" height="16"/><rect x="92" y="236" width="16" height="16"/><rect x="110" y="236" width="16" height="16"/><rect x="128" y="236" width="16" height="16"/><rect x="146" y="236" width="16" height="16"/><rect x="164" y="236" width="16" height="16"/><rect x="182" y="236" width="16" height="16"/><rect x="200" y="236" width="16" height="16"/>
    </g>
    <text x="232" y="224" fill="#9a6b12" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">3 rows, 8 columns</text>
  </g>

  <text x="40" y="286" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">sends packet 0. Seven more follow</text>
  <text x="40" y="312" fill="#1c2833" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">coefficient</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
    <rect x="40" y="320" width="22" height="22" rx="3" fill="#1c2833"/>
    <text x="51" y="336" fill="#ffffff">1</text>
    <rect x="66" y="320" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/>
    <text x="77" y="336" fill="#7f8c8d">0</text>
    <rect x="92" y="320" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/>
    <text x="103" y="336" fill="#7f8c8d">0</text>
    <rect x="118" y="320" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/>
    <text x="129" y="336" fill="#7f8c8d">0</text>
    <rect x="144" y="320" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/>
    <text x="155" y="336" fill="#7f8c8d">0</text>
    <rect x="170" y="320" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/>
    <text x="181" y="336" fill="#7f8c8d">0</text>
    <rect x="196" y="320" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/>
    <text x="207" y="336" fill="#7f8c8d">0</text>
    <rect x="222" y="320" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/>
    <text x="233" y="336" fill="#7f8c8d">0</text>
  </g>
  <text x="40" y="366" fill="#1c2833" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">payload</text>
  <rect x="40" y="374" width="210" height="26" fill="#e67e22"/>
  <rect x="40" y="400" width="210" height="26" fill="#1e8449"/>
  <rect x="40" y="426" width="210" height="26" fill="#2471a3"/>
  <rect x="40" y="374" width="210" height="78" fill="none" stroke="#1c2833" stroke-width="1.5"/>
  <text x="40" y="478" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">batch 12 is on the packet.</text>
  <text x="40" y="500" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">The single 1 says this is column 0 of G.</text>

  <text x="406" y="88" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">sees two packets of batch 12</text>
  <text x="406" y="116" fill="#1a5276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">packet 0</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">
    <rect x="406" y="124" width="18" height="18" rx="2" fill="#1c2833"/><text x="415" y="137" fill="#ffffff">1</text>
    <rect x="426" y="124" width="18" height="18" rx="2" fill="#ffffff" stroke="#bfc9ca"/><text x="435" y="137" fill="#7f8c8d">0</text>
    <rect x="446" y="124" width="18" height="18" rx="2" fill="#ffffff" stroke="#bfc9ca"/><text x="455" y="137" fill="#7f8c8d">0</text>
    <rect x="466" y="124" width="18" height="18" rx="2" fill="#ffffff" stroke="#bfc9ca"/><text x="475" y="137" fill="#7f8c8d">0</text>
    <rect x="486" y="124" width="18" height="18" rx="2" fill="#ffffff" stroke="#bfc9ca"/><text x="495" y="137" fill="#7f8c8d">0</text>
    <rect x="506" y="124" width="18" height="18" rx="2" fill="#ffffff" stroke="#bfc9ca"/><text x="515" y="137" fill="#7f8c8d">0</text>
    <rect x="526" y="124" width="18" height="18" rx="2" fill="#ffffff" stroke="#bfc9ca"/><text x="535" y="137" fill="#7f8c8d">0</text>
    <rect x="546" y="124" width="18" height="18" rx="2" fill="#ffffff" stroke="#bfc9ca"/><text x="555" y="137" fill="#7f8c8d">0</text>
  </g>
  <rect x="406" y="148" width="158" height="16" fill="#e67e22"/>
  <rect x="406" y="164" width="158" height="16" fill="#1e8449"/>
  <rect x="406" y="180" width="158" height="16" fill="#2471a3"/>
  <text x="578" y="168" fill="#1a5276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">x a</text>

  <text x="406" y="224" fill="#1a5276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">packet 1</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">
    <rect x="406" y="232" width="18" height="18" rx="2" fill="#ffffff" stroke="#bfc9ca"/><text x="415" y="245" fill="#7f8c8d">0</text>
    <rect x="426" y="232" width="18" height="18" rx="2" fill="#1c2833"/><text x="435" y="245" fill="#ffffff">1</text>
    <rect x="446" y="232" width="18" height="18" rx="2" fill="#ffffff" stroke="#bfc9ca"/><text x="455" y="245" fill="#7f8c8d">0</text>
    <rect x="466" y="232" width="18" height="18" rx="2" fill="#ffffff" stroke="#bfc9ca"/><text x="475" y="245" fill="#7f8c8d">0</text>
    <rect x="486" y="232" width="18" height="18" rx="2" fill="#ffffff" stroke="#bfc9ca"/><text x="495" y="245" fill="#7f8c8d">0</text>
    <rect x="506" y="232" width="18" height="18" rx="2" fill="#ffffff" stroke="#bfc9ca"/><text x="515" y="245" fill="#7f8c8d">0</text>
    <rect x="526" y="232" width="18" height="18" rx="2" fill="#ffffff" stroke="#bfc9ca"/><text x="535" y="245" fill="#7f8c8d">0</text>
    <rect x="546" y="232" width="18" height="18" rx="2" fill="#ffffff" stroke="#bfc9ca"/><text x="555" y="245" fill="#7f8c8d">0</text>
  </g>
  <rect x="406" y="256" width="158" height="16" fill="#e67e22"/>
  <rect x="406" y="272" width="158" height="16" fill="#1e8449"/>
  <rect x="406" y="288" width="158" height="16" fill="#2471a3"/>
  <text x="578" y="276" fill="#1a5276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">x b</text>

  <text x="406" y="332" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">adds them, and sends</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
    <rect x="406" y="344" width="22" height="22" rx="3" fill="#1a5276"/><text x="417" y="360" fill="#ffffff">a</text>
    <rect x="432" y="344" width="22" height="22" rx="3" fill="#1a5276"/><text x="443" y="360" fill="#ffffff">b</text>
    <rect x="458" y="344" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/><text x="469" y="360" fill="#7f8c8d">0</text>
    <rect x="484" y="344" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/><text x="495" y="360" fill="#7f8c8d">0</text>
    <rect x="510" y="344" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/><text x="521" y="360" fill="#7f8c8d">0</text>
    <rect x="536" y="344" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/><text x="547" y="360" fill="#7f8c8d">0</text>
    <rect x="562" y="344" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/><text x="573" y="360" fill="#7f8c8d">0</text>
    <rect x="588" y="344" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/><text x="599" y="360" fill="#7f8c8d">0</text>
  </g>
  <rect x="406" y="376" width="210" height="22" fill="#e67e22"/>
  <rect x="406" y="398" width="210" height="22" fill="#1e8449"/>
  <rect x="406" y="420" width="210" height="22" fill="#2471a3"/>
  <rect x="406" y="376" width="210" height="66" fill="none" stroke="#1c2833" stroke-width="1.5"/>
  <text x="406" y="512" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">a hits packet 0's coefficient and payload.</text>
  <text x="406" y="534" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">b does the same to packet 1.</text>
  <text x="406" y="568" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">The relay does not learn p1, p4, or p6.</text>

  <text x="776" y="88" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">receives the relay's packet</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
    <rect x="776" y="100" width="22" height="22" rx="3" fill="#1a5276"/><text x="787" y="116" fill="#ffffff">a</text>
    <rect x="802" y="100" width="22" height="22" rx="3" fill="#1a5276"/><text x="813" y="116" fill="#ffffff">b</text>
    <rect x="828" y="100" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/><text x="839" y="116" fill="#7f8c8d">0</text>
    <rect x="854" y="100" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/><text x="865" y="116" fill="#7f8c8d">0</text>
    <rect x="880" y="100" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/><text x="891" y="116" fill="#7f8c8d">0</text>
    <rect x="906" y="100" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/><text x="917" y="116" fill="#7f8c8d">0</text>
    <rect x="932" y="100" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/><text x="943" y="116" fill="#7f8c8d">0</text>
    <rect x="958" y="100" width="22" height="22" rx="3" fill="#ffffff" stroke="#bfc9ca"/><text x="969" y="116" fill="#7f8c8d">0</text>
  </g>
  <rect x="776" y="130" width="210" height="18" fill="#e67e22"/>
  <rect x="776" y="148" width="210" height="18" fill="#1e8449"/>
  <rect x="776" y="166" width="210" height="18" fill="#2471a3"/>

  <text x="776" y="214" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">batch 12 rebuilds the same G</text>
  <g>
    <rect x="772" y="226" width="316" height="78" rx="6" fill="#ffffff" stroke="#b9770e" stroke-dasharray="5 3"/>
    <rect x="784" y="242" width="18" height="16" rx="2" fill="#e67e22"/>
    <rect x="784" y="262" width="18" height="16" rx="2" fill="#1e8449"/>
    <rect x="784" y="282" width="18" height="16" rx="2" fill="#2471a3"/>
    <g fill="#fdebd0" stroke="#e6b98a">
      <rect x="810" y="242" width="16" height="16"/><rect x="828" y="242" width="16" height="16"/><rect x="846" y="242" width="16" height="16"/><rect x="864" y="242" width="16" height="16"/><rect x="882" y="242" width="16" height="16"/><rect x="900" y="242" width="16" height="16"/><rect x="918" y="242" width="16" height="16"/><rect x="936" y="242" width="16" height="16"/>
      <rect x="810" y="262" width="16" height="16"/><rect x="828" y="262" width="16" height="16"/><rect x="846" y="262" width="16" height="16"/><rect x="864" y="262" width="16" height="16"/><rect x="882" y="262" width="16" height="16"/><rect x="900" y="262" width="16" height="16"/><rect x="918" y="262" width="16" height="16"/><rect x="936" y="262" width="16" height="16"/>
      <rect x="810" y="282" width="16" height="16"/><rect x="828" y="282" width="16" height="16"/><rect x="846" y="282" width="16" height="16"/><rect x="864" y="282" width="16" height="16"/><rect x="882" y="282" width="16" height="16"/><rect x="900" y="282" width="16" height="16"/><rect x="918" y="282" width="16" height="16"/><rect x="936" y="282" width="16" height="16"/>
    </g>
    <text x="968" y="270" fill="#9a6b12" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">same G</text>
  </g>

  <text x="776" y="334" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">so the payload comes apart</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">
    <rect x="776" y="350" width="96" height="44" rx="6" fill="#e67e22"/>
    <text x="824" y="378">p1</text>
    <rect x="886" y="350" width="96" height="44" rx="6" fill="#1e8449"/>
    <text x="934" y="378">p4</text>
    <rect x="996" y="350" width="96" height="44" rx="6" fill="#2471a3"/>
    <text x="1044" y="378">p6</text>
  </g>
  <text x="776" y="424" fill="#196f3d" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">row of p1, weighted by a and b</text>
  <text x="776" y="446" fill="#196f3d" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">rows of p4 and p6, the same way</text>
  <text x="776" y="488" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Other batches overlap these packets.</text>
  <text x="776" y="510" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Together they restore all K of them.</text>
</svg>
