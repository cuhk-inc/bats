<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 188" width="760" height="188">
  <rect width="760" height="188" fill="#ffffff"/>
  <text x="20" y="28" fill="#1c2833" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">One generation: K source packets. This picture uses a small K so the subset is visible.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1c2833" text-anchor="middle">
    <rect x="20" y="48" width="64" height="44" rx="4" fill="#f4f6f7" stroke="#566573"/>
    <text x="52" y="75">p0</text>
    <rect x="96" y="48" width="64" height="44" rx="4" fill="#d5f5e3" stroke="#196f3d" stroke-width="2"/>
    <text x="128" y="75">p1</text>
    <rect x="172" y="48" width="64" height="44" rx="4" fill="#f4f6f7" stroke="#566573"/>
    <text x="204" y="75">p2</text>
    <rect x="248" y="48" width="64" height="44" rx="4" fill="#f4f6f7" stroke="#566573"/>
    <text x="280" y="75">p3</text>
    <rect x="324" y="48" width="64" height="44" rx="4" fill="#d5f5e3" stroke="#196f3d" stroke-width="2"/>
    <text x="356" y="75">p4</text>
    <rect x="400" y="48" width="64" height="44" rx="4" fill="#f4f6f7" stroke="#566573"/>
    <text x="432" y="75">p5</text>
    <rect x="476" y="48" width="64" height="44" rx="4" fill="#d5f5e3" stroke="#196f3d" stroke-width="2"/>
    <text x="508" y="75">p6</text>
    <rect x="552" y="48" width="64" height="44" rx="4" fill="#f4f6f7" stroke="#566573"/>
    <text x="584" y="75">p7</text>
    <text x="640" y="75" fill="#5d6d7e">...</text>
    <rect x="668" y="48" width="72" height="44" rx="4" fill="#f4f6f7" stroke="#566573"/>
    <text x="704" y="75">pK-1</text>
  </g>
  <path d="M96 108 h444" fill="none" stroke="#196f3d" stroke-width="1.5"/>
  <path d="M96 108 v8 M540 108 v8" fill="none" stroke="#196f3d" stroke-width="1.5"/>
  <text x="318" y="138" fill="#196f3d" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">this batch draws degree d = 3 and takes p1, p4, p6</text>
  <text x="20" y="170" fill="#5d6d7e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">The next batch draws a new degree and a new subset. Overlapping batches cover the generation.</text>
</svg>
